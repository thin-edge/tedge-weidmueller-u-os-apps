# u-OS Data Hub -> thin-edge measurement mapping.
#
# One entry per line: provider:key[:mode]
#   mode = r  (read, default)  - polled and published as a thin-edge measurement
#          w  (write)          - reserved for a future write trigger, not polled
#          rw (both)
#
# Find available provider/key names via the "data_hub_variables" Cumulocity
# configuration snapshot (Device Management > Configuration > Get snapshot),
# or docker exec <container> data-hub-list-variables.sh <provider>.
#
# Example:
# plc1:temp:r
# plc1:setpoint:rw
